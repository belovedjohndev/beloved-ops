services:
  postgres:
    image: postgres:16
    container_name: belovedops-postgres
    environment:
      POSTGRES_DB: belovedops_dev
      POSTGRES_USER: belovedops
      POSTGRES_PASSWORD: belovedops_dev_password
    ports:
      - "15435:5432"
    volumes:
      - belovedops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belovedops -d belovedops_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  belovedops_postgres_data:
